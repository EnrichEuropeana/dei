apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: dei-template
  annotations:
    description: "Template for deploying DEI (Data Exchange Infrastructure) on OKD / OpenShift"
    tags: "java,spring-boot,dei,europeana"
objects:
  # 1. PersistentVolumeClaim for temporary conversion files
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-conversion-pvc
      labels:
        app: ${APP_NAME}
        environment: ${ENVIRONMENT}
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: ${STORAGE_SIZE}
      storageClassName: ${STORAGE_CLASS}

  # 2. ConfigMap for application configuration and external services
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${APP_NAME}-config
      labels:
        app: ${APP_NAME}
        environment: ${ENVIRONMENT}
    data:
      SERVER_PORT: "${SERVER_PORT}"
      SERVER_SERVLET_CONTEXT_PATH: "${SERVER_SERVLET_CONTEXT_PATH}"
      CONVERSION_DIRECTORY: "${CONVERSION_DIRECTORY}"
      RSYNC_SRC_SUBDIR: "${RSYNC_SRC_SUBDIR}"
      RSYNC_DEST_HOST: "${RSYNC_DEST_HOST}"
      RSYNC_DEST_USER: "${RSYNC_DEST_USER}"
      RSYNC_DEST_PATH: "${RSYNC_DEST_PATH}"
      RSYNC_DEST_PORT: "${RSYNC_DEST_PORT}"
      CONVERSION_IIIF_SERVER_URL: "${CONVERSION_IIIF_SERVER_URL}"
      TRANSCRIPTION_API_URL: "${TRANSCRIPTION_API_URL}"
      TRANSCRIPTION_NEW_API_URL: "${TRANSCRIPTION_NEW_API_URL}"
      TRANSCRIPTION_HAU_NEW_API_URL: "${TRANSCRIPTION_HAU_NEW_API_URL}"
      TRANSCRIPTION_KB_NEW_API_URL: "${TRANSCRIPTION_KB_NEW_API_URL}"
      EUROPEANA_API_ANNOTATIONS_ENDPOINT: "${EUROPEANA_API_ANNOTATIONS_ENDPOINT}"
      EUROPEANA_API_RECORD_ENDPOINT: "${EUROPEANA_API_RECORD_ENDPOINT}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      KEYCLOAK_RESOURCE: "${KEYCLOAK_RESOURCE}"
      KEYCLOAK_AUTH_SERVER_URL: "${KEYCLOAK_AUTH_SERVER_URL}"
      KEYCLOAK_CONFIDENTIAL_PORT: "${KEYCLOAK_CONFIDENTIAL_PORT}"
      JAVA_OPTS: "${JAVA_OPTS}"
      sync.sh: |
        #!/bin/sh
        set -e

        SRC_SUBDIR="${RSYNC_SRC_SUBDIR:-out}"
        BASE_DIR="${CONVERSION_DIRECTORY:-/data/conversion}"
        SRC_DIR="${BASE_DIR}/${SRC_SUBDIR}"

        if [ ! -d "$SRC_DIR" ]; then
          echo "Source directory $SRC_DIR does not exist. Nothing to sync."
          exit 0
        fi

        if [ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]; then
          echo "Source directory $SRC_DIR is empty. Nothing to sync."
          exit 0
        fi

        echo "Preparing SSH credentials..."
        mkdir -p /tmp/.ssh
        export HOME=/tmp

        SSH_KEY_FOUND=""
        for key_file in /etc/ssh-key/id_ed25519 /etc/ssh-key/id_rsa /etc/ssh-key/ssh-privatekey /etc/ssh-key/*; do
          if [ -f "$key_file" ]; then
            cp "$key_file" /tmp/.ssh/id_ed25519
            chmod 600 /tmp/.ssh/id_ed25519
            SSH_KEY_FOUND="/tmp/.ssh/id_ed25519"
            break
          fi
        done

        if [ -z "$SSH_KEY_FOUND" ]; then
          echo "Error: SSH private key not found in /etc/ssh-key (expected id_ed25519, id_rsa, or ssh-privatekey)."
          exit 1
        fi

        DEST_USER="${RSYNC_DEST_USER:-dei}"
        DEST_HOST="${RSYNC_DEST_HOST}"
        DEST_PORT="${RSYNC_DEST_PORT:-22}"
        DEST_PATH="${RSYNC_DEST_PATH:-iiifFiles}"

        if [ -z "$DEST_HOST" ]; then
          echo "Error: RSYNC_DEST_HOST is not configured."
          exit 1
        fi

        echo "Starting synchronization of $SRC_DIR/ to ${DEST_USER}@${DEST_HOST}:${DEST_PATH}/ via SSH (port ${DEST_PORT})..."
        rsync -avz \
          -e "ssh -i ${SSH_KEY_FOUND} -p ${DEST_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o LogLevel=ERROR" \
          "$SRC_DIR/" \
          "${DEST_USER}@${DEST_HOST}:${DEST_PATH}/"

        echo "Rsync synchronization completed successfully at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."

  # 3. DEI Application Deployment
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      labels:
        app: ${APP_NAME}
        environment: ${ENVIRONMENT}
    spec:
      replicas: ${{REPLICAS}}
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            environment: ${ENVIRONMENT}
        spec:
          containers:
            - name: dei-app
              image: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
                  name: http
                  protocol: TCP
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: ${ENVIRONMENT}
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}-config
                - secretRef:
                    name: ${APP_NAME}-secret
              volumeMounts:
                - name: conversion-storage
                  mountPath: /data/conversion
              resources:
                requests:
                  memory: ${MEMORY_REQUEST}
                  cpu: ${CPU_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
                  cpu: ${CPU_LIMIT}
              readinessProbe:
                httpGet:
                  path: ${SERVER_SERVLET_CONTEXT_PATH}/
                  port: 8080
                initialDelaySeconds: 45
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
              livenessProbe:
                httpGet:
                  path: ${SERVER_SERVLET_CONTEXT_PATH}/
                  port: 8080
                initialDelaySeconds: 90
                periodSeconds: 20
                timeoutSeconds: 5
                failureThreshold: 3
          volumes:
            - name: conversion-storage
              persistentVolumeClaim:
                claimName: ${APP_NAME}-conversion-pvc

  # 4. Internal Service
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      labels:
        app: ${APP_NAME}
        environment: ${ENVIRONMENT}
    spec:
      ports:
        - port: 8080
          targetPort: 8080
          name: http
          protocol: TCP
      selector:
        app: ${APP_NAME}

  # 5. Route with SSL termination
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      labels:
        app: ${APP_NAME}
        environment: ${ENVIRONMENT}
    spec:
      to:
        kind: Service
        name: ${APP_NAME}
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  # 6. Rsync CronJob for synchronizing conversion output files to external server
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${APP_NAME}-rsync-cronjob
      labels:
        app: ${APP_NAME}
        environment: ${ENVIRONMENT}
    spec:
      schedule: "${RSYNC_SCHEDULE}"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          template:
            metadata:
              labels:
                app: ${APP_NAME}-rsync
                environment: ${ENVIRONMENT}
            spec:
              restartPolicy: OnFailure
              containers:
                - name: rsync
                  image: ${RSYNC_IMAGE}
                  imagePullPolicy: IfNotPresent
                  command:
                    - /bin/sh
                    - /scripts/sync.sh
                  envFrom:
                    - configMapRef:
                        name: ${APP_NAME}-config
                  volumeMounts:
                    - name: conversion-storage
                      mountPath: ${CONVERSION_DIRECTORY}
                      readOnly: true
                    - name: ssh-key-volume
                      mountPath: /etc/ssh-key
                      readOnly: true
                    - name: rsync-script
                      mountPath: /scripts
                      readOnly: true
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
              volumes:
                - name: conversion-storage
                  persistentVolumeClaim:
                    claimName: ${APP_NAME}-conversion-pvc
                - name: ssh-key-volume
                  secret:
                    secretName: ${RSYNC_SSH_SECRET_NAME}
                    defaultMode: 256
                - name: rsync-script
                  configMap:
                    name: ${APP_NAME}-config
                    defaultMode: 0755
                    items:
                      - key: sync.sh
                        path: sync.sh

parameters:
  - name: APP_NAME
    displayName: Application Name
    description: "Name of the application and its Kubernetes resources"
    value: "dei"
    required: true

  - name: ENVIRONMENT
    displayName: Environment / Profile
    description: "Active environment and Spring profile (e.g. test, prod)"
    value: "test"
    required: true

  - name: IMAGE_REGISTRY
    displayName: Container Image Registry
    description: "Registry host and project/organization path for the container image (e.g. registry.example.com/enrich-europeana)"
    value: "registry.example.com/enrich-europeana"
    required: true

  - name: IMAGE_NAME
    displayName: Container Image Name
    description: "Image repository name in the registry"
    value: "dei"
    required: true

  - name: IMAGE_TAG
    displayName: Image Tag
    description: "Image tag to deploy"
    value: "latest"
    required: true

  - name: REPLICAS
    displayName: Replica Count
    description: "Number of application pod replicas"
    value: "1"
    required: true

  - name: STORAGE_SIZE
    displayName: Conversion PVC Storage Size
    description: "Storage size for temporary conversion files"
    value: "10Gi"
    required: true

  - name: STORAGE_CLASS
    displayName: Conversion PVC Storage Class
    description: "Storage class for the conversion PVC (e.g. standard or manila-share for ReadWriteMany support)"
    value: "standard"
    required: true

  - name: SERVER_PORT
    displayName: Server Port
    value: "8080"

  - name: SERVER_SERVLET_CONTEXT_PATH
    displayName: Servlet Context Path
    value: "/dei"

  - name: CONVERSION_DIRECTORY
    displayName: Conversion Mount Directory
    value: "/data/conversion"

  - name: CONVERSION_IIIF_SERVER_URL
    displayName: IIIF Server URL
    value: "https://iiif.example.com"

  - name: TRANSCRIPTION_API_URL
    displayName: Transcription API URL
    value: "https://transcription.example.com/api"

  - name: TRANSCRIPTION_NEW_API_URL
    displayName: Transcription New API URL
    value: "https://api.transcription.example.com/v2"

  - name: TRANSCRIPTION_HAU_NEW_API_URL
    displayName: HAU Transcription API URL
    value: "https://annotations.transcription.example.com/v2"

  - name: TRANSCRIPTION_KB_NEW_API_URL
    displayName: KB Transcription API URL
    value: "https://transcribathon.example.com/v2"

  - name: EUROPEANA_API_ANNOTATIONS_ENDPOINT
    displayName: Europeana Annotations Endpoint
    value: "https://api.europeana.eu/annotation/"

  - name: EUROPEANA_API_RECORD_ENDPOINT
    displayName: Europeana Record Endpoint
    value: "https://api.europeana.eu/record/v2"

  - name: KEYCLOAK_REALM
    displayName: Keycloak Realm
    value: "enrich-europeana"

  - name: KEYCLOAK_RESOURCE
    displayName: Keycloak Resource / Client ID
    value: "dei-app"

  - name: KEYCLOAK_AUTH_SERVER_URL
    displayName: Keycloak Auth Server URL
    value: "https://sso.example.com/auth"

  - name: KEYCLOAK_CONFIDENTIAL_PORT
    displayName: Keycloak Confidential Port
    value: "443"

  - name: JAVA_OPTS
    displayName: JVM Options
    value: "-Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.3,TLSv1.2 -Xms512m -Xmx2048m"

  - name: MEMORY_REQUEST
    displayName: Memory Request
    value: "1Gi"

  - name: MEMORY_LIMIT
    displayName: Memory Limit
    value: "3Gi"

  - name: CPU_REQUEST
    displayName: CPU Request
    value: "500m"

  - name: CPU_LIMIT
    displayName: CPU Limit
    value: "2"

  - name: RSYNC_SCHEDULE
    displayName: Rsync CronJob Schedule
    description: "Cron schedule expression for rsync job (e.g. */15 * * * * for every 15 minutes)"
    value: "*/15 * * * *"
    required: true

  - name: RSYNC_IMAGE
    displayName: Rsync Container Image
    description: "Container image containing rsync and ssh utilities"
    value: "instrumentisto/rsync-ssh:latest"
    required: true

  - name: RSYNC_SSH_SECRET_NAME
    displayName: Rsync SSH Secret Name
    description: "Name of the Secret containing the SSH private key (key: id_ed25519, id_rsa, or ssh-privatekey)"
    value: "dei-ssh-secret"
    required: true

  - name: RSYNC_SRC_SUBDIR
    displayName: Rsync Source Subdirectory
    description: "Subdirectory inside CONVERSION_DIRECTORY to synchronize (e.g. out)"
    value: "out"
    required: true

  - name: RSYNC_DEST_HOST
    displayName: Rsync Destination Host / URL
    description: "Destination server hostname or IP address for rsync"
    value: "iiif-storage.example.com"
    required: true

  - name: RSYNC_DEST_USER
    displayName: Rsync Destination SSH User
    description: "SSH user on the destination server"
    value: "dei"
    required: true

  - name: RSYNC_DEST_PATH
    displayName: Rsync Destination Directory Path
    description: "Target directory path on the remote server (e.g. iiifFiles or /data/iiifFiles)"
    value: "iiifFiles"
    required: true

  - name: RSYNC_DEST_PORT
    displayName: Rsync Destination SSH Port
    description: "SSH port on the remote server"
    value: "22"
    required: true
