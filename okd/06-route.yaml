apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dei
  labels:
    app: dei
    environment: test
  # annotations:
  #   haproxy.router.openshift.io/ip_whitelist: 150.254.0.0/16 192.168.1.50 # Optional: space-separated list of allowed IPs/CIDRs
spec:
  # host: dei.apps.your-cluster.com # Optional: uncomment to define a fixed domain
  to:
    kind: Service
    name: dei
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: public-manifest-access
  labels:
    app: dei
    environment: test
  annotations:
    haproxy.router.openshift.io/ip_whitelist: 0.0.0.0/0
spec:
  # host: dei.apps.your-cluster.com # Optional: uncomment to define a fixed domain
  # path: /api/transcription/iiif/manifest # Optional: path for public manifest access
  to:
    kind: Service
    name: dei
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
