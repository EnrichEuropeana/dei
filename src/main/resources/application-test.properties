# Database configuration
spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-db1.man.poznan.pl:3307/dei_ee_test?useLegacyDatetimeCode=false&serverTimezone=UTC}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:dei_ee}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:pass}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# Keep the connection alive if idle for a long time
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# Log queries
spring.jpa.show-sql = false

# Hibernate ddl auto (create, create-drop, update)
spring.jpa.hibernate.ddl-auto = ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Naming strategy
spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# Europeana
europeana.api.annotations.endpoint=${EUROPEANA_API_ANNOTATIONS_ENDPOINT:https://annotation-api-test.eanadev.org/annotation/}
europeana.api.record.endpoint=${EUROPEANA_API_RECORD_ENDPOINT:https://www.europeana.eu/api/v2/record}

# Keycloak integration
keycloak.realm=${KEYCLOAK_REALM:enrich-europeana-dev}
keycloak.resource=${KEYCLOAK_RESOURCE:fresenia-dev.man.poznan.pl}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:https://keycloak-dev.pcss.pl}
keycloak.confidential-port=${KEYCLOAK_CONFIDENTIAL_PORT:443}

server.port=${SERVER_PORT:8080}
server.ssl.enabled=false
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/dei-test}
server.use-forward-headers=true
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# Directory used to store temporary files from conversion process
conversion.iiif.server.url=${CONVERSION_IIIF_SERVER_URL:https://iiif-test.man.poznan.pl}
conversion.directory=${CONVERSION_DIRECTORY:/data/conversion}
