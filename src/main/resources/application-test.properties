transcription.new.api.url=${TRANSCRIPTION_NEW_API_URL:https://api.fresenia-dev.man.poznan.pl/v2}
transcribathon.url=${TRANSCRIBATHON_URL:https://europeana.fresenia-dev.man.poznan.pl/dev}
