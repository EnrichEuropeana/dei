transcription.api.url=${TRANSCRIPTION_API_URL:http://localhost:8080/tp-api}
transcription.new.api.url=${TRANSCRIPTION_NEW_API_URL:http://localhost:8080/v2}
server.servlet.context-path=
europeana.api.tp.authorization-token=${EUROPEANA_API_TP_AUTHORIZATION_TOKEN:}
europeana.new.api.tp.authorization-token=${EUROPEANA_NEW_API_TP_AUTHORIZATION_TOKEN:}
transcribathon.url=${TRANSCRIBATHON_URL:http://localhost:8080}
# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:~/test3;
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driverClassName=org.h2.Driver
# Keycloak integration
keycloak.realm=${KEYCLOAK_REALM:EnrichEuropeana}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080/auth}
keycloak.ssl-required=external
keycloak.public-client=true
keycloak.principal-attribute=preferred_username
keycloak.use-resource-role-mappings:true
keycloak.confidential-port=${KEYCLOAK_CONFIDENTIAL_PORT:18080}
keycloak.resource=${KEYCLOAK_RESOURCE:dei-frontend-app-dev}
# Europeana
europeana.api.annotations.endpoint=http://annotation-api-acceptance.eanadev.org/annotation/
europeana.api.record.endpoint=https://www.europeana.eu/api/v2/record
#europeana.api.record.endpoint=http://metis-preview-api-prod.eanadev.org/api/v2/record
europeana.search.api.url=https://www.europeana.eu/api/v2/search.json
#europeana.search.api.url=http://metis-preview-api-prod.eanadev.org/api/v2/search.json
api.clientId=${API_CLIENT_ID:transcribathon-dei}
api.clientSecret=${API_CLIENT_SECRET:}
api.username=${API_USERNAME:}
api.password=${API_PASSWORD:}
api.tokenEndpoint=${API_TOKEN_ENDPOINT:https://auth.europeana.eu/auth/realms/europeana/protocol/openid-connect/token}
# Search API
ddb.api.key=${DDB_API_KEY:}
ddb.api.url=https://api.deutsche-digitale-bibliothek.de
ddb.search.api.url=/search
ddb.format.api.url=/items/{recordId}/binaries
ddb.binary.api.url=/binary/
ddb.api.itemsEndpoint=/items/{recordId}/edm
conversion.iiif.server.url=${CONVERSION_IIIF_SERVER_URL:http://localhost:8080}
conversion.url.replacements={'teatro-dmaria':'tndm'}
logging.level.reactor=debug