spring.profiles.active=@activatedProperties@

application.server.url=${APPLICATION_SERVER_URL:http://localhost:8080}

# Keycloak integration
keycloak.realm=${KEYCLOAK_REALM:DataExchangeInfrastructure}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:https://keycloak-server-test.eanadev.org/auth}
keycloak.ssl-required=external
keycloak.public-client=true
keycloak.principal-attribute=preferred_username
keycloak.use-resource-role-mappings: true
keycloak.confidential-port=${KEYCLOAK_CONFIDENTIAL_PORT:18080}

# API key
europeana.api.key=${EUROPEANA_API_KEY:api2demo}

#User token
api.userToken=${API_USER_TOKEN:tester1}

# Search API
europeana.search.api.url=https://api.europeana.eu/record/v2/search.json
europeana.search.api.predefined.parameters=profile=rich+facets
europeana.search.api.iiif.query=sv_dcterms_conformsTo:"http://iiif.io/api/image" OR provider_aggregation_edm_isShownBy:*iiif.europeana.eu*
europeana.api.tp.authorization-token=${EUROPEANA_API_TP_AUTHORIZATION_TOKEN:token-value}

# Europeana
europeana.api.annotations.endpoint=/api/annotations
europeana.api.record.endpoint=/api/v2/record

# Port config
server.port=${SERVER_PORT:8443}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:fresenia.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=${SERVER_SSL_KEY_ALIAS:fresenia}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}

# Directory used to store temporary files from conversion process
conversion.iiif.server.url=${CONVERSION_IIIF_SERVER_URL:http://localhost:8080}
conversion.directory=${CONVERSION_DIRECTORY:./dei/temp}

#DDB Search api
# Search API
ddb.api.key=${DDB_API_KEY:}
ddb.api.url=https://api.deutsche-digitale-bibliothek.de
ddb.item.url=https://deutsche-digitale-bibliothek.de/item/
ddb.search.api.url=/search
ddb.format.api.url=/items/{recordId}/binaries
ddb.binary.api.url=/binary/
ddb.api.itemsEndpoint=/items/{recordId}/edm

# Enrichments
dri.api.url=https://repository.dri.ie
dri.api.username=${DRI_API_USERNAME:}
dri.api.token=${DRI_API_TOKEN:none}

# IIIF Validation
iiif.manifest.validation.service.url=https://presentation-validator.iiif.io/validate

# Annotations
manual.transcription.mime.type=text/plain
htr.transcription.mime.type=application/vnd.prima.page+xml
htr.enabled=false